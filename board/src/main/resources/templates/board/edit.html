<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{common/head :: bootstrap}"></th:block>
    <title>게시글 수정하기</title>
</head>
<body>
<div th:replace="~{common/header :: header}"></div>

<main class="container">
    <p class="alert alert-warning" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <h1 class="mb-3">글 수정</h1>
    <form th:action="@{/board/update/{idx}(idx=${board.boardIdx})}" method="post">
        <div class="mb-3">
            <label class="form-label" for="title">제목</label>
            <input class="form-control" type="text" id="title" name="title" th:value="${board.title}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="content">내용</label>
            <textarea class="form-control" id="content" name="content" rows="8" th:text="${board.content}"></textarea>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">수정</button>
            <a class="btn btn-outline-secondary" th:href="@{/board/detail/{idx}(idx=${board.boardIdx})}">취소</a>
        </div>
    </form>
</main>

</body>
</html>
