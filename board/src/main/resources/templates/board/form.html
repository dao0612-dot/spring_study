<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{common/head :: bootstrap}"></th:block>
    <title th:text="${board == null} ? '글쓰기' : '글 수정'"></title>
</head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="container">
    <h1 class="mb-3" th:text="${board == null} ? '글쓰기' : '글 수정'"></h1>

    <form id="write-form" th:action="${board == null} ? @{/api/board/save} : @{/api/board/update/{idx}(idx=${board.boardIdx})}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label" for="title">제목</label>
            <input class="form-control" type="text" id="title" name="title" th:value="${board?.title}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="content">내용</label>
            <textarea class="form-control" id="content" name="content" rows="8" th:text="${board?.content}"></textarea>
        </div>
        <div class="mb-3" th:if="${board == null}">
            <label class="form-label" for="file">파일 업로드</label>
            <input class="form-control" type="file" id="file" name="file" accept=".jpg,.jpeg,.png,.gif,.pdf,.txt,.hwp,.docx,.xlsx,.pptx">
            <div class="form-text">jpg, jpeg, png, gif, pdf, txt, hwp, docx, xlsx, pptx 파일만 올릴 수 있습니다.</div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" id="save-button" type="submit"
                    th:text="${board == null} ? '게시글 작성' : '수정'"></button>
            <a class="btn btn-outline-secondary" th:if="${board != null}"
               th:href="@{/board/detail/{idx}(idx=${board.boardIdx})}">취소</a>
        </div>
    </form>
</main>

<script>
const form = document.getElementById('write-form');
const button = document.getElementById('save-button');
const MAX_FILE_SIZE = 100 * 1024 * 1024; // 서버 설정 max-file-size와 맞출 것

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = form.file?.files[0]; // 파일 칸(name="file")에서 고른 파일, 없으면 undefined
    if (file && file.size > MAX_FILE_SIZE){
        alert('파일이 너무 큽니다.');
        return;
    }

    const formData = new FormData(form);
    button.disabled = true;

    try {
        const res = await fetch(form.action, {method: 'POST', body: formData});
        if (res.ok) {
            alert('저장되었습니다.');
            const body = await res.json();
            location.href = '/board/detail/' + body.data;
        } else if (res.status === 401) {
            alert('로그인이 필요한 서비스입니다.');
            button.disabled = false;
        } else if (res.status === 403) {
            const body = await res.json();
            alert(body.message ?? '화면이 만료되었습니다. 새로고침 후 다시 시도해주세요.');
            button.disabled = false;
        } else if (res.status === 413) {
            alert('파일이 너무 큽니다.');
            button.disabled = false;
        } else {
            const body = await res.json();
            alert(body.message ?? '오류가 발생했습니다.');
            button.disabled = false;
        }
    } catch (err) {
        console.error(err);
        alert('전송에 실패했습니다. 다시 시도해주세요.');
        button.disabled = false;
    }

});

</script>
</body>
</html>
