<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{common/head :: bootstrap}"></th:block>
    <title>게시판 리스트</title>
</head>
<body>
<div th:replace="~{common/header :: header}"></div>

<main class="container">
    <p class="alert alert-warning" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <h1 class="mb-3">게시판 리스트</h1>
    <table class="table table-hover">
        <thead class="table-light">
        <tr>
            <th>제목</th>
            <th>내용</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boards}">
            <td><a th:href="@{/board/detail/{idx}(idx=${board.boardIdx})}" th:text="${board.title}"></a></td>
            <td th:text="${board.content}"></td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
