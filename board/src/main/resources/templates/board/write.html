<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{common/head :: bootstrap}"></th:block>
    <title>게시글 쓰기</title>
</head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="container">
    <p class="alert alert-warning" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <h1 class="mb-3">글쓰기</h1>

    <form id="write-form" th:action="@{/board/save}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label" for="title">제목</label>
            <input class="form-control" type="text" id="title" name="title">
        </div>
        <div class="mb-3">
            <label class="form-label" for="content">내용</label>
            <textarea class="form-control" id="content" name="content" rows="8"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label" for="file">파일 업로드</label>
            <input class="form-control" type="file" id="file" name="file">
        </div>
        <button class="btn btn-primary" id="save-button" type="submit">게시글 작성</button>
    </form>
</main>

<script>
const form = document.getElementById('write-form');
const button = document.getElementById('save-button');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    button.disabled = true;

    try {
        const res = await fetch('/api/board/save', {method: 'POST', body: formData});
        if (res.ok) {
            alert('저장되었습니다.');
            location.href = '/board/list';
        } else if (res.status === 413) {
            alert('파일이 너무 큽니다.');
            button.disabled = false;
        } else if (res.status === 401) {
            alert('로그인이 필요한 서비스입니다.');
            button.disabled = false;
        } else if (res.status === 403) {
            alert('화면이 만료되었습니다. 새로고침 후 다시 시도해주세요.');
            button.disabled = false;
        } else {
            const body = await res.json();
            alert(body.message ?? '오류가 발생했습니다.');
            button.disabled = false;
        }
    } catch (err) {
        console.error(err);
        alert('전송에 실패했습니다. 다시 시도해주세요.');
        button.disabled = false;
    }

});

</script>
</body>
</html>
