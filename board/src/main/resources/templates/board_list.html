<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 리스트</title>
</head>
<body>

<h1>게시판 리스트</h1>
<table>
    <tr>
        <th>제목</th>
        <th>내용</th>
    </tr>
    <tr th:each="board : ${boards}">
        <td th:text="${board['title']}"></td>
        <td th:text="${board['content']}"></td>
    </tr>
</table>

</body>
</html>
