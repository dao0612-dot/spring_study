<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 쓰기</title>
</head>
<body>


<p th:if="${errorMessage}" th:text="${errorMessage}"></p>


<h1>글쓰기</h1>

    <form id="write-form" th:action="@{/board/save}" method="post" enctype="multipart/form-data">
        <label for="title">제목</label>
        <input type="text" id="title" name="title">

        <label for="content">내용</label>
        <textarea id="content" name="content"></textarea>

        <label for="file">파일 업로드</label>
        <input type="file" id="file" name="file">

        <button id="save-button" type="submit">게시글 작성</button>

    </form>

<script>
const form = document.getElementById('write-form');
const button = document.getElementById('save-button');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    button.disabled = true;

    try {
        const res = await fetch('/api/board/save', {method: 'POST', body: formData});
        if (res.ok) {
            alert('저장되었습니다.');
            location.href = '/board/list';
        } else if (res.status === 413) {
            alert('파일이 너무 큽니다.');
            button.disabled = false;
        } else {
            const body = await res.json();
            alert(body.message);
            button.disabled = false;
        }
    } catch (err) {
        console.error(err);
        alert('전송에 실패했습니다. 다시 시도해주세요.');
        button.disabled = false;
    }


});

</script>
</body>
</html>
