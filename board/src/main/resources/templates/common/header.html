<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 모든 화면 맨 위에 넣는 공통 메뉴. 화면에서 th:replace="~{common/header :: header}"로 가져다 씀 -->
<nav th:fragment="header">
    <a th:href="@{/}">홈</a> |
    <a th:href="@{/board/list}">게시판</a> |
    <a th:href="@{/member/login}">로그인</a> |
    <a th:href="@{/member/join}">회원가입</a>
    <!-- 로그아웃은 POST만 받음 → 링크가 아니라 폼 버튼(th:action이라 CSRF 숨은 칸 자동) -->
    <form th:action="@{/member/logout}" method="post" style="display:inline">
        <button type="submit">로그아웃</button>
    </form>
</nav>

</body>
</html>
