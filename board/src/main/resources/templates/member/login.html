<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{common/head :: bootstrap}"></th:block>
    <title>로그인</title>
</head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="container">
    <h1 class="mb-3">로그인</h1>

    <p class="alert alert-danger" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않습니다.</p>

    <form class="col-md-6" id="login-form" th:action="@{/member/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="userId">아이디</label>
            <input class="form-control" type="text" id="userId" name="userId">
        </div>
        <div class="mb-3">
            <label class="form-label" for="pwd">비밀번호</label>
            <input class="form-control" type="password" id="pwd" name="pwd">
        </div>
        <button class="btn btn-primary" type="submit">로그인</button>
        <a class="btn btn-link" th:href="@{/member/join}">회원가입</a>
    </form>
</main>

</body>
</html>
