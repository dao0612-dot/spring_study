<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 모든 화면 맨 위에 넣는 공통 메뉴. 화면에서 th:replace="~{common/header :: header}"로 가져다 씀 -->
<nav th:fragment="header" class="navbar navbar-expand bg-body-tertiary border-bottom mb-4">
    <div class="container">
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">홈</a>
            <a class="nav-link" th:href="@{/board/list}">게시판</a>
            <a class="nav-link" th:href="@{/board/write}">글쓰기</a>
            <a class="nav-link" th:href="@{/member/login}">로그인</a>
            <a class="nav-link" th:href="@{/member/join}">회원가입</a>
        </div>
        <!-- 로그아웃은 POST만 받음 → 링크가 아니라 폼 버튼(th:action이라 CSRF 숨은 칸 자동) -->
        <form class="ms-auto" th:action="@{/member/logout}" method="post">
            <button class="btn btn-outline-secondary btn-sm" type="submit">로그아웃</button>
        </form>
    </div>
</nav>

</body>
</html>
