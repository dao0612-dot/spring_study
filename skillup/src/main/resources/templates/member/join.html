<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <th:block th:replace="~{common/head :: bootstrap}"></th:block>
    <title>회원가입</title>
</head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="container">
    <h1 class="mb-3">회원가입</h1>

    <form class="col-md-6" id="join-form">
        <div class="mb-3">
            <label class="form-label" for="userId">아이디</label>
            <input class="form-control" type="text" id="userId" name="userId">
        </div>
        <div class="mb-3">
            <label class="form-label" for="pwd">비밀번호</label>
            <input class="form-control" type="password" id="pwd" name="pwd">
            <div class="form-text">8자 이상, 영문과 숫자를 모두 포함</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="name">이름</label>
            <input class="form-control" type="text" id="name" name="name">
        </div>
        <button class="btn btn-primary" id="join-button" type="submit">회원가입</button>
    </form>
</main>

<script>
    const form = document.getElementById('join-form');
    const button = document.getElementById('join-button');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        button.disabled = true;

        try {
            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

            const res = await fetch('/api/member/join', {method: 'POST', headers: { [csrfHeader]: csrfToken }, body: formData});
            if (res.ok) {
                alert('가입되었습니다.');
                location.href = '/member/login';
            } else if (res.status === 403) {
                alert('화면이 만료되었습니다. 새로고침 후 다시 시도해주세요.');
                button.disabled = false;
            } else {
                const body = await res.json();
                alert(body.message ?? '오류가 발생했습니다.');
                button.disabled = false;
            }
        } catch (err) {
            console.error(err);
            alert('가입에 실패했습니다. 다시 시도해주세요.');
            button.disabled = false;
        }

    });

</script>
</body>
</html>
